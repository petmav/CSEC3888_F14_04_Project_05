# CI for the Redbelly Address Check Snap (redbelly-address-snap/).
#
# GitHub only runs workflows from the repository root, so the Snap's own
# template workflows under redbelly-address-snap/.github never ran. This runs
# the same checks from here, scoped to the Snap's folder.

name: Snap CI

on:
  # Every PR into main, not only those touching the Snap: this is a required
  # check there, and a path-filtered check never reports on other PRs, which
  # would leave them waiting forever.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'redbelly-address-snap/**'
      - '.github/workflows/snap-ci.yml'
  workflow_dispatch:

concurrency:
  group: snap-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: redbelly-address-snap

jobs:
  snap:
    name: Snap lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: redbelly-address-snap/.nvmrc
          cache: yarn
          cache-dependency-path: redbelly-address-snap/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      # The tests run against the built bundle.
      - name: Test
        run: yarn test

      # The build rewrites the manifest's shasum; a change here means the
      # committed manifest does not match the committed source.
      - name: Require clean working directory
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job (stale snap.manifest.json?)"
            exit 1
          fi

      - name: Upload Snap bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: redbelly-address-check-${{ github.sha }}
          path: redbelly-address-snap/packages/snap/dist
          retention-days: 14
